[package]
name = "rs_poke"
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/undivisible/rs_poke"
description = "Rust client and tunnel bridge for Poke"
readme = "README.md"
keywords = ["poke", "mcp", "tunnel", "ai"]
categories = ["api-bindings", "network-programming"]

[[bin]]
name = "poke"
path = "src/bin/poke.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
bytes = "1.10"
dirs = "6.0"
futures-util = "0.3"
http = "1.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.20"
